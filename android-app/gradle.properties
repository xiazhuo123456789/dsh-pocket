# Heap is deliberately small but not tiny. 1024m was enough until the bundled ML
# Kit barcode model + CameraX were added: the debug variant then has to merge a
# much larger set of dex archives, and D8 died with `OutOfMemoryError: Java heap
# space` in `mergeExtDexDebug`. 1536m keeps it under the ~2.5GB free RAM ceiling
# on this 16GB machine; higher values cause the daemon itself to be OOM-killed
# by the OS, which manifests as "daemon disappeared unexpectedly".
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+UseSerialGC -Xss1m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
