# Heap is deliberately small but not tiny. 1024m was enough until the bundled ML
# Kit barcode model + CameraX were added: the debug variant then has to merge a
# much larger set of dex archives, and D8 died with `OutOfMemoryError: Java heap
# space` in `mergeExtDexDebug`. 1536m keeps it under the ~2.5GB free RAM ceiling
# on this 16GB machine; higher values cause the daemon itself to be OOM-killed
# by the OS, which manifests as "daemon disappeared unexpectedly".
#
# 2026-10-21: the ceiling moved. With the DSH desktop app + a browser running,
# free RAM sat at ~2.1 GB and the 1536m heap got the daemon OOM-killed mid-build
# ("Gradle build daemon disappeared unexpectedly"). Release builds fit in 1152m
# (kotlin 768m, one worker); only `assembleDebug`'s `mergeExtDexDebug` needs the
# old 1536m. Raise these back if you build debug on a quieter machine.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -Xss1m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=192m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official

# R8 full mode keeps a much larger native working set; on this 16 GB box the
# daemon gets OOM-killed (hs_err: malloc failed ... Chunk::new) when the browser
# and chat apps are open. Non-full mode still shrinks and obfuscates.
android.enableR8.fullMode=false
