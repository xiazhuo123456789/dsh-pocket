# Heap is deliberately small but not tiny. 1024m was enough until the bundled ML
# Kit barcode model + CameraX were added: the debug variant then has to merge a
# much larger set of dex archives, and D8 died with `OutOfMemoryError: Java heap
# space` in `mergeExtDexDebug`. 1792m is the smallest value that gets through on a
# 16 GB machine while still leaving room for the OS -- raising it further is
# counter-productive here because the box only has ~2.5 GB free on a busy day.
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Xss1m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official
